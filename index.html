<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penfold Tradebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-[#0f172a]/80 backdrop-blur sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-blue-500/30">
                P
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                    PENFOLD <span class="text-blue-500 font-medium text-sm">TRADEBOOK</span>
                </h1>
                <p class="text-xs text-slate-400">XAUUSD & USDJPY Quantitative Terminal</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="openNewTradeModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-4 py-2 rounded-lg shadow-lg shadow-blue-600/20 transition flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                New Trade
            </button>
        </div>
    </header>

    <nav class="bg-[#0b1120] border-b border-slate-800 px-4 lg:px-8 flex space-x-6 overflow-x-auto text-sm">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="py-3 font-medium border-b-2 border-blue-500 text-blue-400 whitespace-nowrap transition">Dashboard</button>
        <button onclick="switchTab('journal')" id="nav-journal" class="py-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">Journal Ledger</button>
        <button onclick="switchTab('calendar')" id="nav-calendar" class="py-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">Monthly Calendar</button>
        <button onclick="switchTab('calculator')" id="nav-calculator" class="py-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">Risk Calculator</button>
        <button onclick="switchTab('analytics')" id="nav-analytics" class="py-3 font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 whitespace-nowrap transition">Performance Analytics</button>
    </nav>

    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full">
        <section id="tab-dashboard" class="space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-[#0f172a] border border-slate-800 p-4 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">Net P&L</p>
                    <h3 id="dash-net-pnl" class="text-2xl font-bold mt-1 text-emerald-400">+$0.00</h3>
                    <span id="dash-trade-count" class="text-[10px] text-slate-500 mt-1 block">0 trades recorded</span>
                </div>
                <div class="bg-[#0f172a] border border-slate-800 p-4 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">Win Rate</p>
                    <h3 id="dash-win-rate" class="text-2xl font-bold mt-1 text-white">0.0%</h3>
                    <span class="text-[10px] text-slate-500 mt-1 block">Winning vs Losing</span>
                </div>
                <div class="bg-[#0f172a] border border-slate-800 p-4 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">Profit Factor</p>
                    <h3 id="dash-profit-factor" class="text-2xl font-bold mt-1 text-blue-400">0.00</h3>
                    <span class="text-[10px] text-slate-500 mt-1 block">Gross Win / Loss</span>
                </div>
                <div class="bg-[#0f172a] border border-slate-800 p-4 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">Average R:R</p>
                    <h3 id="dash-avg-rr" class="text-2xl font-bold mt-1 text-purple-400">0.00 R</h3>
                    <span class="text-[10px] text-slate-500 mt-1 block">Reward to Risk</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#0f172a] border border-slate-800 p-5 rounded-2xl flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-semibold text-slate-200">Cumulative Equity Curve</h2>
                        <span class="text-xs text-slate-4
